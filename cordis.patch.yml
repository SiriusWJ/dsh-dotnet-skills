# dsh-dotnet-skills — one Host row that keeps a GitHub .NET skill catalog cached
# and injects a project-scoped subset from a composer button.
#
# Nothing is mirrored globally: the vendored checkout under checkoutDir is a
# cache only, and skills reach a session when a human injects them for the
# project in `.dsh/skills` (DSH's project skill root, rank 100).
- insert:
    - id: dotnet-skills
      name: dsh-dotnet-skills
      config:
        # Catalog source (shallow clone, branch below). Changing it replaces the
        # checkout: a checkout of another repository is never reused.
        repoUrl: https://github.com/managedcode/dotnet-skills.git
        branch: main
        # Default checkout: $DSH_HOME/vendor/dotnet-skills.
        checkoutDir: ''
        # Refresh the checkout this often, and once shortly after DSH starts.
        intervalHours: 6
        runOnStart: true
        startDelaySeconds: 20
        # The composer panel asks the current model to pick skills for the
        # project (facts from files + the catalog). Bounds on that one call:
        selectMaxSkills: 10
        selectTimeoutMs: 45000
        # Git executable; override when `git` is not on the PATH of the DSH process.
        gitCommand: git
